name: Hungary appointment check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: hungary-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      # Exits with code 1 when a possible slot is found -> run shows as "failed"
      # -> GitHub also emails you, in addition to the bot's own email.
      - run: python cloud_bot.py
        env:
          FORM_DETAILS_JSON: ${{ secrets.FORM_DETAILS_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
